<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>

  <link rel="stylesheet" href="adminPage.css">
  <link rel="stylesheet" href="/profile-menu.css">
  <link rel="icon" href="data:,">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>NexTicket</h2>

  <hr style="margin:10px 0">

  <h4>Admin</h4>
  <div class="nav-item" data-page="admin" onclick="window.location.href='/admin.html'">Dashboard Admin</div>

  <div class="nav-item" data-page="dashboardUsers" onclick="window.location.href='/dashboardUsers.html'">Dashboard Utenti</div><!-- Utenti → Ticket → Pagamento-->
  <!-- <div class="nav-item">Dashboard Biglietti</div> → Potremo gestirli da utenti o da eventi o da entrambi-->
  <div class="nav-item" data-page="dashboardEvents" onclick="window.location.href='/dashboardEvents.html'">Dashboard Eventi</div><!-- Eventi → TicketTypes → Ticket-->
  <div class="nav-item" data-page="dashboardLocations" onclick="window.location.href='/dashboardLocations.html'">Dashboard Location</div><!-- Eventi → TicketTypes → Ticket-->
  <div class="nav-item" data-page="dashboardNotifications" onclick="window.location.href='/dashboardNotifications.html'">Dashboard Notifiche</div><!-- Eventi → TicketTypes → Ticket-->
</div>

<!-- TOPBAR -->
<div class="topbar">
  <form id="searchForm" class="search-form">
    <input id="searchInput" type="text" class="search" placeholder="Cerca evento">

    <button type="submit" class="topbar_btn">
      🔍 Cerca
    </button>
  </form>

  <div class="topbar-right">
    <button type="button" class="topbar_btn" onclick="toggleTheme()">🌔 Tema</button>

    <div class="profile-menu">
      <button type="button" class="profile-btn" onclick="toggleMenu()">
        👤 <span id="username">Admin</span> ▼
      </button>

      <div class="dropdown-menu" id="dropdownMenu">
        <a href="/profilo.html">Profilo</a>
        <a href="/biglietti.html">I miei biglietti</a>
        <a href="#" id="topBarBtn">Logout</a>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="main">

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="admin-panel" style="display:none;">
    <!-- riempito da JS -->
  </div>

</div>

<!-- SCRIPT -->
<script type="module" src="adminPage.js"></script>
<script type="module" src="profilo.js"></script>

</body>
</html>
