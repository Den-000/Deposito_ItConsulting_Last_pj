<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EventsManager Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/profile-menu.css">
</head>

<body>

<div class="sidebar">
  <h2>EventsManager</h2>

  <div id="navEventsBtn" class="nav-item">Eventi</div>
  <div class="nav-item" onclick="window.location.href='/biglietti.html'">I Miei Biglietti</div>

  <hr style="margin:10px 0">

  <h4>Check-In</h4>
  <input type="text" placeholder="Inserisci qr code">

  <button>Effettua Check-In</button>
</div>

<div class="topbar">
  <form id="searchForm" class="search-form">
    <input id="searchInput" type="text" class="search" placeholder="Cerca evento">

    <button type="submit" class="topbar_btn">
      🔍 Cerca
    </button>
  </form>

  <div class="topbar-right">
    <button type="button" class="topbar_btn" onclick="toggleTheme()">🌔 Tema</button>

    <div class="profile-menu">
      <button type="button" class="profile-btn" onclick="toggleMenu()">
        👤 <span id="username">Utente</span> ▼
      </button>

      <div class="dropdown-menu" id="dropdownMenu">
        <a href="/profilo.html">Profilo</a>
        <a href="/biglietti.html">I miei biglietti</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </div>
  </div>
</div>

<div class="main" id="main">
  <div id="adminPanel" class="admin-panel" style="display:none;">
    <h3>📊 ADMIN PANEL</h3>

    <p>Utenti totali: 120</p>
    <p>Attivi: 98</p>
    <p>Admin: 5</p>

    <hr>
    <button>Promuovi Admin</button>
    <button>Banna Utente</button>
  </div>
</div>

<script type="module" src="app.js"></script>
<script type="module" src="profilo.js"></script>
</body>
</html>
