<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profilo</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/profile-menu.css">
</head>

<body>

<div class="sidebar">
  <h2>NexTicket</h2>

  <div class="nav-item" onclick="window.location.href='/home.html'">Eventi</div>
  <div class="nav-item" onclick="window.location.href='/biglietti.html'">I Miei Biglietti</div>

  <hr style="margin:10px 0">

  <h4>Check-In</h4>
  <input type="text" placeholder="Inserisci qr code">
  <button type="button">Effettua Check-In</button>
</div>

<div class="topbar">
  <div></div>

  <div class="topbar-right">
    <button type="button" class="topbar_btn" onclick="toggleTheme()">🌔 Tema</button>

    <div class="profile-menu">
      <button type="button" class="profile-btn" onclick="toggleMenu()">
        👤 <span class="profile-name hidden-until-loaded"></span> ▼
      </button>

      <div class="dropdown-menu" id="dropdownMenu">
        <a href="/biglietti.html">I miei biglietti</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </div>
  </div>
</div>

<div class="profile-main">
  <div class="card profile-card">

    <h2>Profilo Utente</h2>

    <div class="profile-field">
      <label>Username</label>
      <div id="p_username"></div>
    </div>

    <div class="profile-field">
      <label>Nome</label>
      <div id="p_name"></div>
    </div>

    <div class="profile-field">
      <label>Cognome</label>
      <div id="p_surname"></div>
    </div>

    <div class="profile-field">
      <label>Email</label>
      <div id="p_email"></div>
    </div>

    <div class="profile-field">
      <label>Telefono</label>
      <div id="p_phone"></div>
    </div>

    <div class="profile-field">
      <label>Password</label>
      <div class="password-row">
        <input type="password" id="p_password" value="" readonly>
        <button type="button" id="togglePassword">👁</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="profilo.js"></script>
</body>
</html>
