<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>

  <link rel="stylesheet" href="adminPage.css">
  <link rel="stylesheet" href="/profile-menu.css">
  <link rel="icon" href="data:,">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>NexTicket</h2>

  <hr style="margin:10px 0">

  <h4>Admin</h4>
  <div class="nav-item" data-page="admin" onclick="window.location.href='/admin.html'">Dashboard Admin</div>
  <div class="nav-item" data-page="dashboardUsers" onclick="window.location.href='/dashboardUsers.html'">Dashboard Utenti</div>
  <div class="nav-item active" data-page="dashboardEvents" onclick="window.location.href='/dashboardEvents.html'">Dashboard Eventi</div>
  <div class="nav-item" data-page="dashboardLocations" onclick="window.location.href='/dashboardLocations.html'">Dashboard Location</div>
  <div class="nav-item" data-page="dashboardNotifications" onclick="window.location.href='/dashboardNotifications.html'">Dashboard Notifiche</div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <form id="searchForm" class="search-form">
    <input id="searchInput" type="text" class="search" placeholder="Cerca evento">

    <button type="submit" class="topbar_btn">
      🔍 Cerca
    </button>
  </form>

  <div class="topbar-right">
    <button type="button" class="topbar_btn" onclick="toggleTheme()">🌔 Tema</button>

    <div class="profile-menu">
      <button type="button" class="profile-btn" onclick="toggleMenu()">
        👤 <span id="username">Admin</span> ▼
      </button>

      <div class="dropdown-menu" id="dropdownMenu">
        <a href="/profilo.html">Profilo</a>
        <a href="#" id="topBarBtn">Logout</a>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <h2>🎫 Events Dashboard</h2>

  <table id="eventsTable">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Data</th>
        <th>Location</th>
        <th>Stato</th>
        <th>Azioni</th>
      </tr>
    </thead>

    <tbody id="eventsBody">
      <!-- JS inject -->
    </tbody>
  </table>

</div>

<!-- SCRIPT -->
<script type="module" src="dashboardEvents.js"></script>
<script type="module" src="profilo.js"></script>

</body>
</html>
