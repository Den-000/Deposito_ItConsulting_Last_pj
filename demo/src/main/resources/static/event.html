<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dettaglio Evento</title>

  <link rel="stylesheet" href="event.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Eventi</h2>
  <div class="nav-item" id="goHome">Home</div>
  <div class="nav-item" onclick="window.location.href='/biglietti.html'">I Miei Biglietti</div>

  <hr style="margin:10px 0">

  <h4>Check-In</h4>
  <input type="text" placeholder="Inserisci qr code">

  <button>Effettua Check-In</button>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <form id="searchForm" class="search-form">
    <input id="searchInput" type="text" class="search" placeholder="Cerca evento">

    <button type="submit" class="topbar_btn">
      🔍 Cerca
    </button>
  </form>

  <div class="topbar-right">
    <button type="button" class="topbar_btn" onclick="toggleTheme()">🌔 Tema</button>

    <div class="profile-menu">
      <button type="button" class="profile-btn" onclick="toggleMenu()">
        👤 <span id="username">Utente</span> ▼
      </button>

      <div class="dropdown-menu" id="dropdownMenu">
        <a href="/profilo.html">Profilo</a>
        <a href="/biglietti.html">I miei biglietti</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main" style="grid-template-columns: 1fr;">

  <div class="card">

    <div class="card-header">
      <small id="date"></small>
      <small id="location"></small>
    </div>

    <h2 id="name">Caricamento...</h2>

    <p id="description"></p>

    <div class="badge medium" id="seats"></div>

    <small id="status"></small>

    <div class="tickets">
      <h3>Biglietti disponibili</h3>
      <div id="ticketsList"></div>
    </div>

  </div>

</div>

<!-- JS -->
<script type="module" src="eventPage.js"></script>

</body>
</html>
