<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dettaglio Evento</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="event.css">
  <link rel="stylesheet" href="/profile-menu.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>EventsManager</h2>
  <div class="nav-item" onclick="window.location.href='/home.html'">Eventi</div>
  <div class="nav-item" onclick="window.location.href='/biglietti.html'">I Miei Biglietti</div>

  <hr style="margin:10px 0">

  <h4>Check-In</h4>
  <input type="text" placeholder="Inserisci qr code">
  <button>Effettua Check-In</button>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <form id="searchForm" class="search-form">
    <input id="searchInput" type="text" class="search" placeholder="Cerca evento">

    <button type="submit" class="topbar_btn">
      🔍 Cerca
    </button>
  </form>

  <div class="topbar-right">
    <button type="button" class="topbar_btn" onclick="toggleTheme()">🌔 Tema</button>

    <div class="profile-menu">
      <button type="button" class="profile-btn" onclick="toggleMenu()">
        👤 <span class="profile-name hidden-until-loaded"></span> ▼
      </button>

      <div class="dropdown-menu" id="dropdownMenu">
        <a href="/profilo.html">Profilo</a>
        <a href="/biglietti.html">I miei biglietti</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main event-main">

  <section class="event-hero-card">
    <div class="event-hero-image">
      <img src="https://images.unsplash.com/photo-1501386761578-eac5c94b800a?q=80&w=1200&auto=format&fit=crop" alt="Immagine evento">
    </div>

    <div class="event-hero-main">
      <div class="event-date-row">
        <span id="date"></span>
      </div>

      <h1 id="name">Caricamento...</h1>

      <p id="description"></p>

      <div class="event-badges">
        <div class="event-seats" id="seats"></div>
        <div class="event-status status-badge" id="status"></div>
      </div>
    </div>

    <div class="event-hero-location">
      <h3>Dove</h3>
      <p id="location"></p>
    </div>
  </section>

  <section class="tickets-section">
    <div class="tickets-section-header">
      <div class="tickets-icon">🎟</div>
      <h2>Biglietti disponibili</h2>
      <p>Scegli il tipo di biglietto che preferisci</p>
    </div>

    <div id="ticketsList"></div>
  </section>

</div>

<!-- JS -->
<script type="module" src="eventPage.js"></script>

</body>
</html>
